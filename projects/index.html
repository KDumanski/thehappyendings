<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · The Happy Endings</title>
<meta name="description" content="Active projects and client work by The Happy Endings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414;
    --bg-card:#1c1c1c;
    --bg-card-hover:#222121;
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.16);
    --text:#ece8e1;
    --muted:#a7a299;
    --muted-dim:#6f6b64;
    --accent:#c8415c;
    --live:#4caf78;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  .container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* Ambient glow */
  .glow{
    position:fixed;top:-220px;left:50%;transform:translateX(-50%);
    width:760px;height:520px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(200,65,92,0.18), transparent 70%);
    filter:blur(20px);pointer-events:none;z-index:0;
  }

  /* Top bar */
  header.top{position:relative;z-index:2;padding:24px 0}
  .top-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-0.01em;font-size:16px}
  .brand .mark{color:var(--accent);font-size:18px;line-height:1}
  .top-link{font-size:14px;color:var(--muted);font-weight:500;transition:color .15s}
  .top-link:hover{color:var(--text)}

  /* Hero */
  section.hero{position:relative;z-index:2;padding:56px 0 40px}
  .kicker{
    display:inline-block;font-size:13px;font-weight:600;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px;
  }
  h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;letter-spacing:-0.03em;line-height:1.05}
  .lead{font-size:clamp(1.05rem,2.2vw,1.2rem);color:var(--muted);max-width:560px;margin-top:18px}

  /* Group heading */
  .group{position:relative;z-index:2;padding:8px 0 0}
  .group-head{display:flex;align-items:baseline;gap:14px;margin:40px 0 20px}
  .group-title{font-size:0.82rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
  .group-rule{flex:1;height:1px;background:var(--border)}
  .group-count{font-size:0.82rem;color:var(--muted-dim);font-weight:500}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding-bottom:8px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}

  /* Card */
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
    padding:26px 26px 24px;overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
    opacity:.9;
  }
  .card::after{
    content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(closest-side,var(--c1),transparent 70%);
    opacity:.10;transition:opacity .18s ease;pointer-events:none;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--border-hover);background:var(--bg-card-hover)}
  .card:hover::after{opacity:.20}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .tag{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none}
  .badge-live{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    color:var(--live);background:rgba(76,175,120,0.10);
    border:1px solid rgba(76,175,120,0.25);border-radius:999px;padding:4px 10px;
  }
  .badge-live .pulse{width:7px;height:7px;border-radius:50%;background:var(--live)}

  .card h2{font-size:1.4rem;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
  .card p{font-size:0.97rem;color:var(--muted);margin-top:10px;flex:1}
  .card-cta{
    display:inline-flex;align-items:center;gap:8px;margin-top:20px;
    font-size:14px;font-weight:600;color:var(--text);
  }
  .card-cta .arrow{transition:transform .18s ease;color:var(--c1)}
  .card:hover .card-cta .arrow{transform:translateX(4px)}

  /* Footer */
  footer{position:relative;z-index:2;margin-top:auto;padding:48px 0 40px;border-top:1px solid var(--border)}
  .foot-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .foot-inner span{font-size:13px;color:var(--muted-dim)}
  .foot-inner a{color:var(--muted);font-weight:500}
  .foot-inner a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <div class="container top-inner">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">◆</span> The Happy Endings</a>
    <a class="top-link" href="mailto:keith.dumanski@gmail.com">Get in touch →</a>
  </div>
</header>

<section class="hero">
  <div class="container">
    <span class="kicker">Selected work</span>
    <h1>Active projects.</h1>
    <p class="lead">A few of the sites and tools I'm building and running right now. Live client work, all in active use.</p>
  </div>
</section>

<main class="group">
  <div class="container">
    <div class="group-head">
      <span class="group-title">Live &amp; in use</span>
      <span class="group-rule"></span>
      <span class="group-count">4 projects</span>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="container foot-inner">
    <span>© <span id="year">2026</span> The Happy Endings</span>
    <a href="mailto:keith.dumanski@gmail.com">keith.dumanski@gmail.com</a>
  </div>
</footer>

<script>
  // Single source of truth for the project cards. Add/edit a project here.
  const PROJECTS = [
    {
      name: "St. Mark's Yoga",
      tag: "Client · Analytics",
      desc: "Live insights dashboard for the East Village studio. Bookings, retention funnels and revenue trends, auto-refreshed every morning.",
      href: "/yoga/",
      cta: "Open dashboard",
      c1: "#c8415c", c2: "#e0738c",
    },
    {
      name: "Dental Group",
      tag: "Client · Healthcare",
      desc: "Clean, trustworthy site for a dental practice: services, team and an easy path to booking an appointment.",
      href: "https://kdumanski.github.io/DentalGroup/",
      cta: "Visit site",
      c1: "#2bb6a8", c2: "#5fded2",
    },
    {
      name: "Stark Level",
      tag: "Client · Consulting",
      desc: "Business solutions and consulting site built for clarity and conversion, live on its own domain.",
      href: "https://starklevelsolutions.com",
      cta: "Visit site",
      c1: "#5b8def", c2: "#86b0ff",
    },
    {
      name: "Fabian's Tours",
      tag: "Client · Travel",
      desc: "Cinematic luxury Egypt tours and sacred journeys. A brand-forward site for an intimate, high-end travel experience.",
      href: "https://kdumanski.github.io/fabians-tours/",
      cta: "Visit site",
      c1: "#d9a441", c2: "#f0c970",
    },
  ];

  const grid = document.getElementById('grid');
  for (const p of PROJECTS) {
    const ext = /^https?:/.test(p.href);
    const a = document.createElement('a');
    a.className = 'card';
    a.href = p.href;
    a.style.setProperty('--c1', p.c1);
    a.style.setProperty('--c2', p.c2);
    if (ext) { a.target = '_blank'; a.rel = 'noopener'; }
    a.setAttribute('aria-label', p.name + ': ' + p.cta);
    a.innerHTML =
      '<div class="card-top">' +
        '<span class="tag"><span class="dot"></span>' + p.tag + '</span>' +
        '<span class="badge-live"><span class="pulse"></span>Live</span>' +
      '</div>' +
      '<h2>' + p.name + '</h2>' +
      '<p>' + p.desc + '</p>' +
      '<span class="card-cta">' + p.cta + ' <span class="arrow" aria-hidden="true">→</span></span>';
    grid.appendChild(a);
  }

  document.getElementById('year').textContent = '2026';
</script>
</body>
</html>

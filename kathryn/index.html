<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katheryn McGaffigan · This Is My Brain</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #14161c;
    --ink: #f2f1f4;
    --ink-dim: #9a9aa6;
    --line: rgba(255,255,255,0.10);
    /* MTA line colors */
    --red:    #EE352E;  /* 1 · analytical */
    --blue:   #0039A6;  /* A · acting */
    --orange: #FF6319;  /* M · music */
    --green:  #00933C;  /* 4 · memory */
    --purple: #B933AD;  /* 7 · movement */
    --lime:   #6CBE45;  /* G · breath */
    --yellow: #FCCC0A;  /* N · gallery */
    --gray:   #A7A9AC;  /* L · say hello */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .stage {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(12px, 2.5vh, 28px) clamp(16px, 3vw, 48px) clamp(10px, 2vh, 20px);
    max-width: 1440px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 3px solid #fff;
    padding-bottom: 12px;
  }
  .name-row { display: flex; align-items: center; gap: 14px; }
  .k-bullet {
    width: clamp(34px, 4vw, 46px);
    height: clamp(34px, 4vw, 46px);
    border-radius: 50%;
    background: #fff;
    color: #0b0d12;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.2vw, 1.5rem);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  h1 {
    font-weight: 700;
    font-size: clamp(1.5rem, 3.6vw, 2.6rem);
    letter-spacing: 0.01em;
  }
  .service {
    text-align: right;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.7;
  }
  .service b { color: var(--ink); font-weight: 700; }
  .brain-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  svg.brain { width: 100%; height: 100%; max-height: 70vh; }

  .region { cursor: pointer; transition: filter .25s, opacity .25s; opacity: .88; }
  .region:hover, .region:focus-visible { opacity: 1; filter: url(#glow) brightness(1.3); outline: none; }
  .gyri { stroke: rgba(255,255,255,.10); fill: none; stroke-width: 3; stroke-linecap: round; pointer-events: none; }

  .sign { cursor: pointer; }
  .sign rect.plate { fill: #0a0a0a; stroke: rgba(255,255,255,0.35); stroke-width: 1.5; transition: stroke .2s; }
  .sign:hover rect.plate, .sign:focus-visible rect.plate { stroke: #fff; }
  .sign .l1 { fill: #fff; font-weight: 700; font-size: 18px; letter-spacing: .08em; }
  .sign .l2 { fill: var(--ink-dim); font-size: 13px; letter-spacing: .04em; }
  .sign .blt { font-weight: 700; font-size: 18px; text-anchor: middle; }
  .leader { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; pointer-events: none; }
  .kline { fill: none; stroke: rgba(255,255,255,0.20); stroke-width: 5; stroke-linecap: round; pointer-events: none; }
  .stn { fill: #fff; stroke-width: 3; pointer-events: none; }

  footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  .legend { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 12px 0; }
  .legend button {
    font: 700 13px 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: .06em;
    color: var(--ink);
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .legend .b {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700; flex: none;
  }
  .legend .b.dark { color: #0b0d12; }

  /* overlay panel */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,6,10,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center; justify-content: center;
    padding: clamp(12px, 3vw, 48px);
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .panel {
    width: min(780px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    background: rgba(20,20,20,0.97);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65);
  }
  .panel-head {
    position: sticky; top: 0;
    background: #0a0a0a;
    border-bottom: 4px solid var(--accent, #fff);
    padding: 18px clamp(20px, 4vw, 40px);
    display: flex; align-items: center; gap: 14px;
  }
  .panel-head .b {
    width: 38px; height: 38px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    font-size: 1.15rem; font-weight: 700; flex: none;
  }
  .panel-head .b.dark { color: #0b0d12; }
  .panel-head .titles { min-width: 0; }
  .panel-head h2 { font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .panel-head .via { color: var(--ink-dim); font-size: 0.85rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }
  .panel-head .close {
    margin-left: auto;
    background: none; border: none; color: var(--ink-dim);
    font-size: 1.7rem; cursor: pointer; line-height: 1;
  }
  .panel-head .close:hover { color: #fff; }
  .panel-body { padding: clamp(20px, 4vw, 40px); }
  .panel-body .neuro {
    color: var(--ink-dim);
    font-size: 0.98rem;
    font-style: italic;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .panel-body p { line-height: 1.7; font-size: 1.05rem; margin-bottom: 14px; }
  .panel-body ul { list-style: none; margin: 8px 0 16px; }
  .panel-body li {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    line-height: 1.6;
    font-size: 1rem;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .panel-body li b { font-weight: 700; }
  .panel-body li span { color: var(--ink-dim); font-size: 0.9rem; }
  .panel-body .btn {
    display: inline-block;
    margin-top: 8px;
    padding: 13px 26px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .04em;
    text-decoration: none;
  }
  .panel-body .btn.dark { color: #0b0d12; }
  .stops {
    margin: -6px 0 18px;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .stops b { color: var(--ink); }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .shots img { width: 100%; border-radius: 10px; display: block; }
  .shots figcaption { font-size: 13px; color: var(--ink-dim); margin-top: 8px; text-align: center; }

  @media (max-width: 760px) {
    body { overflow-y: auto; }
    .stage { height: auto; min-height: 100vh; }
    svg.brain { max-height: 44vh; }
    .sign, .leader { display: none; }
    .legend { display: flex; }
    .service { display: none; }
    .shots { grid-template-columns: 1fr; }
    footer { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>

</div>

<script>
const PANELS = {
  acting: {

    neuro: "The cells that fire whether you do the thing or watch someone else do it. The whole craft, in one neuron.",
    html: `

  music: {

const overlay = document.getElementById('overlay');
const head = document.getElementById('panelHead');
const bulletEl = document.getElementById('panelBullet');
const titleEl = document.getElementById('panelTitle');
const viaEl = document.getElementById('panelVia');
const bodyEl = document.getElementById('panelBody');
let lastFocus = null;

function openPanel(key) {
  const p = PANELS[key];
  if (!p) return;
  lastFocus = document.activeElement;
  overlay.querySelector('.panel').style.setProperty('--accent', p.accent);
  bulletEl.textContent = p.bullet;
  bulletEl.classList.toggle('dark', p.dark);
  titleEl.textContent = p.title;
  viaEl.textContent = p.via;
  bodyEl.innerHTML = '<div class="neuro">' + p.neuro + '</div>' + p.html;
  bodyEl.querySelectorAll('.btn').forEach(b => b.classList.toggle('dark', p.dark));
  overlay.classList.add('open');
  document.getElementById('closeBtn').focus();
}
function closePanel() {
  overlay.classList.remove('open');
  if (lastFocus) lastFocus.focus();
}
document.querySelectorAll('[data-panel]').forEach(el => {
  el.addEventListener('click', () => openPanel(el.dataset.panel));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(el.dataset.panel); }
  });
});
document.getElementById('closeBtn').addEventListener('click', closePanel);
overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
